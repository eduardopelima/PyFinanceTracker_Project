[project]
name = "py-finances-backend"
version = "0.1.0"
description = ""
authors = [{ name = "EDUARDO LIMA", email = "weduardow123@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.1,<2",
    "fastapi>=0.111.0,<0.112",
    "taskipy>=1.12.2,<2",
    "sqlalchemy>=2.0.30,<3",
    "psycopg2>=2.9.9,<3",
    "openai>=1.30.1,<2",
    "alembic>=1.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.taskipy.tasks]
app = "fastapi dev src/app/main.py"

[tool.uv.workspace]
members = [
    "src/app",
]
